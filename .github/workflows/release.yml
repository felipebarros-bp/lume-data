# SPDX-License-Identifier: AGPL-3.0-only
# Release builds of Lume Data, started by hand (Actions > Release builds > Run workflow).
# Versions are semantic (MAJOR.MINOR.PATCH): the "bump" input moves the last tag vX.Y.Z (or "version" sets
# one); every platform builds that version; when macOS and Linux succeed, the release job writes it into
# CMakeLists.txt, commits "Release vX.Y.Z" to main, tags it, publishes a GitHub Release with the installers
# and generated notes (the app's update check reads it), freezes a docs version on minor / major releases
# and publishes the documentation.
#   macOS   one universal DMG (Apple Silicon + Intel), signed and notarized when the secrets exist
#   Linux   portable .tar.gz for x86_64 and arm64
#   Windows portable .zip for x64 (experimental: the Windows port is not validated yet, BL-058)
# Tests: tests/run_ci.sh, the suites that need no database server (those stay on a developer machine).
# Secrets (Settings > Secrets and variables > Actions), all optional; without them the DMG is ad-hoc signed:
#   MACOS_CERT_P12        base64 of the exported "Developer ID Application" certificate + key (.p12)
#   MACOS_CERT_PASSWORD   the .p12's password
#   NOTARY_KEY_P8         base64 of an App Store Connect API key (.p8), for notarization
#   NOTARY_KEY_ID         that key's id
#   NOTARY_ISSUER         the issuer id shown with the key
name: Release builds

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Next version from the last tag (first release without tags = the version in CMakeLists.txt)
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: Or an exact version (MAJOR.MINOR.PATCH, e.g. 0.2.0); empty = use bump
        type: string
        default: ''
      publish:
        description: Tag and publish the GitHub Release (off = build artifacts only)
        type: boolean
        default: true
      run_tests:
        description: Run the CI test suites before packaging
        type: boolean
        default: true
      channel:
        description: Release channel shown in About
        type: choice
        options: [Development, Early Preview, Beta, Stable]
        default: Early Preview
      notarize:
        description: Notarize the DMG (needs the NOTARY_* secrets)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SDL_TAG: release-3.4.16   # the SDL3 every platform builds against (same as the developer machine)

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      docs_version: ${{ steps.v.outputs.docs_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          set -eu
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')
          cm=$(sed -n 's/^project(lume VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -n "$EXACT" ]; then
            v="${EXACT#v}"
          elif [ -z "$last" ]; then
            v="$cm"   # the first release: the version the code already declares
          else
            ma=${last%%.*}; rest=${last#*.}; mi=${rest%%.*}; pa=${rest#*.}
            case "$BUMP" in
              major) v="$((ma + 1)).0.0" ;;
              minor) v="$ma.$((mi + 1)).0" ;;
              *) v="$ma.$mi.$((pa + 1))" ;;
            esac
          fi
          echo "$v" | grep -Eq "$semver" || { echo "::error::'$v' is not MAJOR.MINOR.PATCH"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "::error::tag v$v already exists"; exit 1; fi
          if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$last" "$v" | sort -V | tail -1)" != "$v" ]; then echo "::error::v$v is not newer than v$last"; exit 1; fi
          # a docs version per minor release (patches update it): 0.2.0 -> "0.2"
          case "$v" in *.0) dv="${v%.0}" ;; *) dv="" ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "docs_version=$dv" >> "$GITHUB_OUTPUT"
          echo "Release version: v$v (last tag: ${last:-none}; docs version: ${dv:-unchanged})" >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS (universal DMG)
    needs: version
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build id in About comes from git
      - name: Version ${{ needs.version.outputs.version }}
        run: sed -i.bak "s/^project(lume VERSION [0-9.]*/project(lume VERSION ${{ needs.version.outputs.version }}/" CMakeLists.txt && grep -n "^project(lume" CMakeLists.txt

      - name: SDL3 (universal, cached)
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-${{ env.SDL_TAG }}-macos-universal-11.0
      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/sdl-src"
          cmake -S "$RUNNER_TEMP/sdl-src" -B "$RUNNER_TEMP/sdl-build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3"
          cmake --build "$RUNNER_TEMP/sdl-build" -j "$(sysctl -n hw.ncpu)"
          cmake --install "$RUNNER_TEMP/sdl-build"

      - name: Build Lume (universal)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl3" -DLUME_CHANNEL="${{ inputs.channel }}"
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          lipo -archs build/lume

      - name: Tests
        if: inputs.run_tests
        env:
          DYLD_FALLBACK_LIBRARY_PATH: ${{ runner.temp }}/sdl3/lib
          PKG_CONFIG_PATH: ${{ runner.temp }}/sdl3/lib/pkgconfig   # suites that compile their own checks against SDL3
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/sdl3                # the ASan build configures its own tree
        run: |
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
          sh tests/run_ci.sh

      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/lume-sign.keychain-db"
          KCPW=$(openssl rand -hex 24)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # the Developer ID G2 intermediate, from Apple (the .p12 holds only the leaf certificate)
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db   # the signing keychain first, the login one kept
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          [ -n "$ID" ] || { echo "no Developer ID Application identity in the .p12"; exit 1; }
          echo "LUME_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Notarization key
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true' && inputs.notarize
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "LUME_NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "LUME_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "LUME_NOTARY_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Package the DMG
        env:
          SDL3_PREFIX: ${{ runner.temp }}/sdl3
        run: |
          cmake --build build --target lume_app
          sh scripts/package_macos.sh build

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/lume-sign.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: lume-macos-universal
          path: build/Lume-Data-*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && inputs.run_tests
        with:
          name: test-report-macos
          path: |
            build/test-report-ci.md
            build/test-logs/

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04       # glibc 2.35: runs on the distributions of the last few years
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    needs: version
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version ${{ needs.version.outputs.version }}
        run: sed -i.bak "s/^project(lume VERSION [0-9.]*/project(lume VERSION ${{ needs.version.outputs.version }}/" CMakeLists.txt && grep -n "^project(lume" CMakeLists.txt
      - name: Build tools and SDL3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config patchelf xvfb xauth \
            libsqlite3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev \
            sqlite3 curl file libpq5   # tests: sqlite3 CLI fixtures, AI mock via curl, file(1), libpq for the connect-failure dialog
      - name: SDL3 (cached)
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-${{ env.SDL_TAG }}-${{ matrix.runner }}
      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/sdl-src"
          cmake -S "$RUNNER_TEMP/sdl-src" -B "$RUNNER_TEMP/sdl-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3"
          cmake --build "$RUNNER_TEMP/sdl-build"
          cmake --install "$RUNNER_TEMP/sdl-build"
      - name: Version ${{ needs.version.outputs.version }}
        run: sed -i "s/^project(lume VERSION [0-9.]*/project(lume VERSION ${{ needs.version.outputs.version }}/" CMakeLists.txt && grep -n "^project(lume" CMakeLists.txt
      - name: Build Lume
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl3" \
            -DLUME_CHANNEL="${{ inputs.channel }}"
          cmake --build build
      - name: Tests
        if: inputs.run_tests
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/sdl3/lib
          PKG_CONFIG_PATH: ${{ runner.temp }}/sdl3/lib/pkgconfig
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/sdl3                # the ASan build configures its own tree
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"; mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a sh tests/run_ci.sh
      - name: Package
        run: sh scripts/package_linux.sh build "$RUNNER_TEMP/sdl3"
      - uses: actions/upload-artifact@v4
        with:
          name: lume-linux-${{ matrix.arch }}
          path: build/lume-data-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && inputs.run_tests
        with:
          name: test-report-linux-${{ matrix.arch }}
          path: |
            build/test-report-ci.md
            build/test-logs/

  windows:
    name: Windows (x64, experimental)
    runs-on: windows-2022
    continue-on-error: true   # until the Windows port is validated (BL-058): never blocks the other platforms
    needs: version
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: MSYS2 (MinGW-w64 UCRT64 toolchain, SDL3, SQLite)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-sqlite3
      - name: Build Lume
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUME_CHANNEL="${{ inputs.channel }}"
          cmake --build build -- -k 0   # keep going: the log lists everything the port still needs
      - name: Package
        run: |
          ver=$(sed -n 's/^project(lume VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          name="lume-data-$ver-windows-x64"
          out="build/$name"
          mkdir -p "$out"
          cp build/lume.exe "$out/"
          # the DLLs it needs from the toolchain (SDL3, SQLite, the C runtime helpers)
          ldd build/lume.exe | awk '/ucrt64/ { print $3 }' | xargs -r -I{} cp {} "$out/"
          cp -R assets "$out/assets"
          cp LICENSE "$out/LICENSE.txt"
          (cd build && zip -qr "$name.zip" "$name")
          sha256sum "build/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: lume-windows-x64
          path: build/lume-data-*.zip
          if-no-files-found: error

  release:
    name: Tag and publish v${{ needs.version.outputs.version }}
    needs: [version, macos, linux, windows]
    # macOS and Linux must succeed; Windows is attached when it built (experimental)
    if: ${{ always() && inputs.publish && needs.version.result == 'success' && needs.macos.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.version.outputs.version }}
      DV: ${{ needs.version.outputs.docs_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: actions/setup-node@v4
        if: ${{ needs.version.outputs.docs_version != '' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Version in the code, docs version
        run: |
          set -eu
          sed -i "s/^project(lume VERSION [0-9.]*/project(lume VERSION $V/" CMakeLists.txt
          if [ -n "$DV" ] && [ -d website ] && ! grep -q "\"$DV\"" website/versions.json 2>/dev/null; then
            (cd website && npm ci && npm run docusaurus docs:version "$DV")
          fi
      - name: Commit and tag
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt website/versions.json website/versioned_docs website/versioned_sidebars 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Release v$V"
          git tag -a "v$V" -m "Lume Data $V"
          git push origin HEAD:main "v$V"
      - name: GitHub Release
        run: |
          set -eu
          ls -R dist | head -40
          files=$(find dist -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.zip' \) | sort)
          [ -n "$files" ] || { echo "::error::no installers to publish"; exit 1; }
          # not marked as a pre-release: the app's update check offers published releases only
          gh release create "v$V" $files --title "Lume Data $V" --generate-notes --verify-tag
          echo "Published https://github.com/${{ github.repository }}/releases/tag/v$V" >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Documentation
    needs: release
    if: ${{ always() && needs.release.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
