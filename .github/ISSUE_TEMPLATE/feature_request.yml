name: Suggestion
description: An idea to make Lume Data better
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The task or the problem behind the idea, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working. Screenshots or sketches are welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Connections, SQL editor, Results grid, Execution plans, Table designer, Database objects, Reports, Lume Intelligence (AI), Source Control, Settings / other]
  - type: dropdown
    id: database
    attributes:
      label: Database
      multiple: true
      options: [SQLite, PostgreSQL, Oracle, MySQL, MariaDB, SQL Server, Not database specific]
